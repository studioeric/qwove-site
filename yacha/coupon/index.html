<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>야차 키우기 쿠폰</title>
<meta name="description" content="야차 키우기 쿠폰 입력 - 보상은 게임 우편함으로 지급됩니다. Yaksha Hunter coupon redemption.">
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0E0A0E;--card:#1A1218;--line:#3A2A22;--gold:#E8C67A;--gold2:#B8913E;--red:#C8323A;--text:#F3EADB;--dim:#A89A88;--ok:#7FD39A;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC","Malgun Gothic",sans-serif}
  body{min-height:100vh;display:flex;justify-content:center;padding:20px 16px 48px;
       background:radial-gradient(120% 60% at 50% -10%,#3a1015 0%,transparent 60%),var(--bg)}
  main{width:100%;max-width:420px}
  .langs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .langs button{width:auto;margin:0;padding:6px 11px;font-size:13px;font-weight:600;border-radius:999px;border:1px solid var(--line);
                background:#140e12;color:var(--dim);box-shadow:none}
  .langs button.on{color:#1a0e08;background:var(--gold);border-color:var(--gold)}
  h1{margin:8px 0 4px;text-align:center;font-size:30px;letter-spacing:2px;color:var(--gold);text-shadow:0 2px 12px rgba(200,50,58,.45)}
  .sub{text-align:center;color:var(--dim);font-size:14px;margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;box-shadow:0 0 0 1px rgba(232,198,122,.06) inset}
  label{display:block;font-size:14px;color:var(--gold);margin:0 0 6px;font-weight:600}
  .hint{font-size:12px;color:var(--dim);margin:6px 0 18px;line-height:1.5}
  input{width:100%;font-size:18px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0B080B;color:var(--text);
        letter-spacing:1px;text-transform:uppercase;outline:none}
  input:focus{border-color:var(--gold2)}
  button{width:100%;margin-top:6px;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:10px;cursor:pointer;color:#fff;
         background:linear-gradient(180deg,#d8424a,#9e1f27);box-shadow:0 2px 0 #5e1116}
  button:disabled{opacity:.55;cursor:default}
  .msg{min-height:22px;margin-top:16px;text-align:center;font-size:15px;line-height:1.5}
  .msg.ok{color:var(--ok)} .msg.err{color:#ff8a8a}
  .note{margin-top:22px;font-size:12px;color:var(--dim);line-height:1.7}
  .note b{color:var(--text);font-weight:600}
  footer{margin-top:28px;text-align:center;font-size:11px;color:#6d6257}
  footer a{color:#8d8070}
</style>
</head>
<body>
<main>
  <div class="langs" id="langs">
    <button type="button" data-l="ko">한국어</button>
    <button type="button" data-l="en">English</button>
    <button type="button" data-l="ja">日本語</button>
    <button type="button" data-l="zh-Hant">繁體中文</button>
  </div>
  <h1 data-t="game">야차 키우기</h1>
  <p class="sub" data-t="sub">쿠폰 입력</p>
  <form class="card" id="f" autocomplete="off">
    <label for="uid" data-t="uidLabel">유저 ID</label>
    <input id="uid" inputmode="latin" maxlength="9" placeholder="ABCD-1234" required>
    <p class="hint" data-t="uidHint"></p>
    <label for="code" data-t="codeLabel">쿠폰 코드</label>
    <input id="code" maxlength="32" required>
    <p class="hint"></p>
    <button id="go" type="submit" data-t="go">쿠폰 사용</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>
  <div class="note" id="note"></div>
  <footer>© QWOVE · 쿼브</footer>
</main>
<script>
(function(){
  var URL = "https://letgxptaskqiyqagazfz.supabase.co/rest/v1/rpc/redeem_coupon";
  var KEY = "sb_publishable_uLXboZjY-ERjPjhcLwJIsQ_rvtxy6rA";
  var MAIL = '<a href="mailto:qwove.corp@gmail.com" style="color:var(--gold)">qwove.corp@gmail.com</a>';
  var T = {
    ko: { game: "야차 키우기", title: "야차 키우기 쿠폰", sub: "쿠폰 입력", uidLabel: "유저 ID", codeLabel: "쿠폰 코드", codePh: "쿠폰 코드", go: "쿠폰 사용",
          uidHint: "게임 → 설정 → 계정 정보 또는 프로필에 있는 8자리 ID예요. \"복사\" 버튼으로 복사해 붙여 넣으면 편해요.",
          note: "· 보상은 <b>게임 우편함</b>으로 보내져요. 게임을 다시 켜면 우편함에서 받을 수 있어요.<br>· 쿠폰은 유저 ID 하나당 한 번만 쓸 수 있어요.<br>· 유저 ID를 잘못 넣으면 보상을 받을 수 없으니 꼭 확인해 주세요.<br>· 문의: " + MAIL,
          ok: "쿠폰 사용 완료! 게임 우편함을 확인해 주세요.", bad_user: "유저 ID 형식이 맞지 않아요. 8자리(예: ABCD-1234)인지 확인해 주세요.",
          bad_code: "없는 쿠폰 코드예요.", not_yet: "아직 사용할 수 없는 쿠폰이에요.", expired: "기간이 끝난 쿠폰이에요.", used: "이미 사용한 쿠폰이에요.",
          too_many: "시도가 너무 많아요. 1분 뒤에 다시 해 주세요.", empty: "쿠폰 코드를 넣어 주세요.", wait: "확인 중…",
          retry: "잠시 후 다시 해 주세요.", net: "연결이 원활하지 않아요. 잠시 후 다시 해 주세요." },
    en: { game: "Yaksha Hunter", title: "Yaksha Hunter Coupon", sub: "Redeem a coupon", uidLabel: "User ID", codeLabel: "Coupon code", codePh: "Coupon code", go: "Redeem",
          uidHint: "Your 8-character ID is in the game under Settings → Account, or on your Profile. Tap \"Copy\" there and paste it here.",
          note: "· Rewards are sent to your <b>in-game Mailbox</b>. Restart the game to collect them.<br>· Each coupon can be used once per User ID.<br>· Please double-check your User ID. Rewards sent to a wrong ID can't be recovered.<br>· Contact: " + MAIL,
          ok: "Coupon redeemed! Check your in-game Mailbox.", bad_user: "That User ID doesn't look right. It should be 8 characters, like ABCD-1234.",
          bad_code: "That coupon code doesn't exist.", not_yet: "This coupon isn't available yet.", expired: "This coupon has expired.", used: "This coupon has already been used.",
          too_many: "Too many attempts. Please try again in a minute.", empty: "Please enter a coupon code.", wait: "Checking…",
          retry: "Please try again shortly.", net: "Connection problem. Please try again shortly." },
    ja: { game: "夜叉退魔録", title: "夜叉退魔録 クーポン", sub: "クーポン入力", uidLabel: "ユーザーID", codeLabel: "クーポンコード", codePh: "クーポンコード", go: "クーポンを使う",
          uidHint: "ゲーム内の「設定」→「アカウント」、またはプロフィールに表示される8桁のIDです。「コピー」ボタンでコピーして貼り付けると便利です。",
          note: "・報酬は<b>ゲーム内のメールボックス</b>に届きます。ゲームを再起動すると受け取れます。<br>・クーポンは1つのユーザーIDにつき1回のみ使用できます。<br>・ユーザーIDを間違えると報酬を受け取れませんので、必ずご確認ください。<br>・お問い合わせ: " + MAIL,
          ok: "クーポンを使用しました！ゲーム内のメールボックスをご確認ください。", bad_user: "ユーザーIDの形式が正しくありません。8桁（例: ABCD-1234）かご確認ください。",
          bad_code: "存在しないクーポンコードです。", not_yet: "このクーポンはまだ使用できません。", expired: "このクーポンは有効期限が切れています。", used: "このクーポンはすでに使用済みです。",
          too_many: "試行回数が多すぎます。1分後にもう一度お試しください。", empty: "クーポンコードを入力してください。", wait: "確認中…",
          retry: "しばらくしてからもう一度お試しください。", net: "通信が不安定です。しばらくしてからもう一度お試しください。" },
    "zh-Hant": { game: "夜叉降妖錄", title: "夜叉降妖錄 序號兌換", sub: "輸入序號", uidLabel: "玩家ID", codeLabel: "序號", codePh: "序號", go: "兌換",
          uidHint: "在遊戲的「設定」→「帳號」或個人資料中可以看到 8 碼 ID。按下「複製」後貼到這裡最方便。",
          note: "・獎勵會寄送到<b>遊戲內的信箱</b>，重新開啟遊戲即可領取。<br>・每組序號每個玩家ID限用一次。<br>・玩家ID輸入錯誤將無法領取獎勵，請務必確認。<br>・聯絡我們：" + MAIL,
          ok: "兌換成功！請到遊戲信箱領取。", bad_user: "玩家ID格式不正確，請確認是否為 8 碼（例：ABCD-1234）。",
          bad_code: "此序號不存在。", not_yet: "此序號尚未開放使用。", expired: "此序號已過期。", used: "此序號已經使用過了。",
          too_many: "嘗試次數過多，請 1 分鐘後再試。", empty: "請輸入序號。", wait: "確認中…",
          retry: "請稍後再試。", net: "連線不穩定，請稍後再試。" }
  };
  var CODES = ["ok", "bad_user", "bad_code", "not_yet", "expired", "used", "too_many"];
  function pick(){
    var q = new URLSearchParams(location.search).get("lang");
    if (q && T[q]) return q;
    try { var s = localStorage.getItem("lang"); if (s && T[s]) return s; } catch (e) {}
    var n = (navigator.languages && navigator.languages[0] || navigator.language || "ko").toLowerCase();
    if (n.indexOf("ko") === 0) return "ko";
    if (n.indexOf("ja") === 0) return "ja";
    if (n.indexOf("zh") === 0 && (n.indexOf("hant") >= 0 || /-(tw|hk|mo)/.test(n))) return "zh-Hant";
    return "en";
  }
  var lang = pick(), L = T[lang];
  var f = document.getElementById("f"), uid = document.getElementById("uid"), code = document.getElementById("code"),
      go = document.getElementById("go"), msg = document.getElementById("msg");
  function apply(l){
    lang = l; L = T[l];
    document.documentElement.lang = l;
    document.title = L.title;
    document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = L[el.getAttribute("data-t")]; });
    document.getElementById("note").innerHTML = L.note;
    code.placeholder = L.codePh;
    document.querySelectorAll("#langs button").forEach(function(b){ b.className = b.getAttribute("data-l") === l ? "on" : ""; });
    msg.textContent = ""; msg.className = "msg";
  }
  document.getElementById("langs").addEventListener("click", function(e){
    var l = e.target.getAttribute && e.target.getAttribute("data-l");
    if (!l || !T[l]) return;
    try { localStorage.setItem("lang", l); } catch (err) {}
    apply(l);
  });
  apply(lang);
  var q = new URLSearchParams(location.search);
  if (q.get("code")) code.value = q.get("code").toUpperCase();
  uid.addEventListener("input", function(){
    var v = uid.value.toUpperCase().replace(/[^0-9A-F]/g, "").slice(0, 8);
    uid.value = v.length > 4 ? v.slice(0, 4) + "-" + v.slice(4) : v;
  });
  function show(t, ok){ msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); }
  f.addEventListener("submit", function(e){
    e.preventDefault();
    var u = uid.value.replace(/-/g, ""), c = code.value.trim().toUpperCase();
    if (u.length !== 8) { show(L.bad_user); return; }
    if (!c) { show(L.empty); return; }
    go.disabled = true; show(L.wait, true);
    fetch(URL, { method: "POST", headers: { "Content-Type": "application/json", "apikey": KEY },
                 body: JSON.stringify({ p_user_code: u, p_code: c }) })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(res){ show(CODES.indexOf(res) >= 0 ? L[res] : L.retry, res === "ok"); if (res === "ok") code.value = ""; })
      .catch(function(){ show(L.net); })
      .then(function(){ go.disabled = false; });
  });
})();
</script>
</body>
</html>
