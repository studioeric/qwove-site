<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QWOVE</title>
<meta name="description" content="QWOVE(쿼브) 모바일 게임 스튜디오">
<style>
  :root{--bg:#f7f5f0;--ink:#1d1b26;--muted:#6b6578;--line:#e3ddd0;--card:#fff;--accent:#8f6712}
  @media (prefers-color-scheme:dark){:root{--bg:#111019;--ink:#ece6da;--muted:#9a94a6;--line:#2b2839;--card:#1a1824;--accent:#e0ae48;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:0 16px}
  main{max-width:560px;margin:0 auto;padding:64px 0;display:flex;flex-direction:column;gap:22px}
  h1{margin:0;font-size:40px;letter-spacing:6px}
  p{margin:0;color:var(--muted);line-height:1.7}
  h2{margin:18px 0 0;font-size:15px;color:var(--muted);font-weight:600}
  a.game{display:flex;justify-content:space-between;align-items:center;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none}
  a.game span{color:var(--muted);font-size:13px}
  footer{margin-top:24px;font-size:13px;color:var(--muted);line-height:1.8}
  footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>QWOVE</h1>
  <p>QWOVE(쿼브)는 짧은 시간에 즐기는 모바일 게임을 만드는 스튜디오입니다.<br>QWOVE is a mobile game studio based in Korea.</p>
  <h2>Games</h2>
  <a class="game" href="/yacha/"><div><b>야차 키우기</b><br><span>Yaksha Hunter: Yokai Idle RPG</span></div><div>›</div></a>
  <footer>
    문의 · Contact: <a href="mailto:qwove.corp@gmail.com">qwove.corp@gmail.com</a><br>
    쿼브(QWOVE) · 사업자등록번호 309-05-67693
  </footer>
</main>
</body>
</html>
